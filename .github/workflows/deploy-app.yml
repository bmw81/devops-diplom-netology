name: 'Build and Deploy App'

on:
  push:
    branches:
      - main
    paths:
      - 'test-app/**'
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    name: 'Build and Deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version from tag (if any)
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./test-app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/test-app:${{ steps.get_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/test-app:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig from secret
        run: |
          mkdir -p $HOME/.kube
          echo '${{ secrets.KUBECONFIG }}' > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/test-app nginx=${{ secrets.DOCKERHUB_USERNAME }}/test-app:${{ steps.get_version.outputs.version }} -n default
          kubectl rollout status deployment/test-app -n default
