name: 'Terraform Apply'

on:
  push:
    branches:
      - main
    paths:
      - '02-infrastructure/**'
      - '00-sa/**'
      - '01-storage/**'

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloud_id: "b1g1ap7lhncbl9q7crfn"
      TF_VAR_folder_id: "b1grbnd43egs57caqic6"
      TF_VAR_default_zone: "ru-central1-a"
      TF_VAR_ssh_public_key: "${{ secrets.SSH_PUBLIC_KEY }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Create service account key file
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_FILE }}' > /tmp/authorized_key.json
          chmod 600 /tmp/authorized_key.json
          echo "TF_VAR_service_account_key_file=/tmp/authorized_key.json" >> $GITHUB_ENV

      - name: Setup Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud CLI
        run: |
          yc config set service-account-key /tmp/authorized_key.json
          yc config set cloud-id ${{ env.TF_VAR_cloud_id }}
          yc config set folder-id ${{ env.TF_VAR_folder_id }}

      - name: Terraform Init (SA)
        run: |
          cd 00-sa
          terraform init

      - name: Terraform Import (SA)
        run: |
          cd 00-sa
          terraform import yandex_iam_service_account.sa_storage ajegs342e71f33sb1agl || true

      - name: Terraform Apply (SA)
        run: |
          cd 00-sa
          terraform apply -auto-approve

      - name: Terraform Init (Storage)
        run: |
          cd 01-storage
          terraform init

      - name: Terraform Import (Storage)
        run: |
          cd 01-storage
          terraform import yandex_storage_bucket.tf_state my-terraform-state-14051981 || true

      - name: Terraform Apply (Storage)
        run: |
          cd 01-storage
          terraform apply -auto-approve

      - name: Terraform Init (Infrastructure)
        run: |
          cd 02-infrastructure
          terraform init

      - name: Terraform Import (Infrastructure)
        run: |
          cd 02-infrastructure
          terraform import yandex_vpc_network.develop enp0gd9eai5qt8j8sqcm || true
          terraform import yandex_vpc_address.master_ip e9bs84p4dtpvaae4n84f || true
          terraform import yandex_vpc_subnet.subnet-a e2lhht8o5sfeneck25vh || true
          terraform import yandex_vpc_subnet.subnet-b e9blfq6nfrfooctaseiq || true
          terraform import yandex_vpc_subnet.subnet-d fl834a6l2icer16558j1 || true
          terraform import yandex_vpc_security_group.nat_sg nat-sg || true
          terraform import yandex_vpc_security_group.lan_sg lan-sg || true

      - name: Terraform Apply (Infrastructure)
        run: |
          cd 02-infrastructure
          terraform apply -auto-approve